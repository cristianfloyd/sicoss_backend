[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
markers =
    unit: Test unitarios rapidos
    integration: Test de integracion con la base de datos
    e2e: Test end_to_end
    performance: Test de rendimiento
    slow: Tests que tardan mucho
    database: Tests que requieren base de datos